# ⚠️ موقتی — بعد از بازیابی کلید، این فایل را حذف کنید.
#
# کلیدِ امضا را از Secrets بیرون می‌آورد، ولی هیچ‌وقت به‌صورت خام:
# قبل از آپلود با رمزی که فقط شما می‌دانید رمزگذاری می‌شود، پس نه در لاگ
# می‌نشیند نه کسی که به artifact دسترسی پیدا کند می‌تواند بازش کند.
name: Export keystore (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: رمزگذاری keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.CUBEPAY_KEYSTORE_BASE64 }}
          PASSPHRASE: ${{ secrets.KEYSTORE_EXPORT_PASSPHRASE }}
        run: |
          set -euo pipefail

          if [ -z "${PASSPHRASE:-}" ]; then
            echo "::error::secret به نام KEYSTORE_EXPORT_PASSPHRASE تعریف نشده."
            exit 1
          fi
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::secret به نام CUBEPAY_KEYSTORE_BASE64 پیدا نشد."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks

          # بررسی سلامت فایل قبل از هر کار دیگر — اگر خروجی base64 خراب باشد،
          # بهتر است همین‌جا بفهمیم تا اینکه یک فایل بی‌مصرف تحویل بگیرید.
          if ! head -c 4 keystore.jks | od -An -tx1 | grep -qiE 'fe ed fe ed|ce ce ce ce|30'; then
            echo "::error::فایل decode شده شبیه keystore نیست."
            exit 1
          fi
          echo "اندازه: $(stat -c%s keystore.jks) بایت"

          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in keystore.jks -out keystore.jks.enc -pass env:PASSPHRASE

          rm -f keystore.jks
          echo "SHA-256 فایل رمزگذاری‌شده:"
          sha256sum keystore.jks.enc

      - name: آپلود
        uses: actions/upload-artifact@v4
        with:
          name: keystore-encrypted
          path: keystore.jks.enc
          retention-days: 1
