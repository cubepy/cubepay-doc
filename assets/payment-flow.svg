<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="152" viewBox="0 0 1000 152" role="img" aria-labelledby="t d"><title id="t">CubePay payment flow</title><desc id="d">Create an invoice, receive payment, verify the result, then fulfill the order in your store.</desc><style>@keyframes move{to{stroke-dashoffset:-24}}.flow{animation:move 2s linear infinite}@media(prefers-reduced-motion:reduce){.flow{animation:none}}</style><rect width="1000" height="152" rx="18" fill="#0d1721"/><path class="flow" d="M130 66H870" stroke="#4ccab4" stroke-width="2" stroke-dasharray="4 8" fill="none"/>
<g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle"><rect x="30" y="28" width="200" height="76" rx="14" fill="#14252f" stroke="#2b4854"/><text x="130" y="58" font-size="13" fill="#52d4be">01</text><text x="130" y="86" font-size="18" fill="#eef3f8">Create invoice</text></g><g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle"><rect x="275" y="28" width="200" height="76" rx="14" fill="#14252f" stroke="#2b4854"/><text x="375" y="58" font-size="13" fill="#52d4be">02</text><text x="375" y="86" font-size="18" fill="#eef3f8">Receive payment</text></g><g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle"><rect x="525" y="28" width="200" height="76" rx="14" fill="#14252f" stroke="#2b4854"/><text x="625" y="58" font-size="13" fill="#52d4be">03</text><text x="625" y="86" font-size="18" fill="#eef3f8">Verify result</text></g><g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle"><rect x="770" y="28" width="200" height="76" rx="14" fill="#14252f" stroke="#2b4854"/><text x="870" y="58" font-size="13" fill="#52d4be">04</text><text x="870" y="86" font-size="18" fill="#eef3f8">Fulfill order</text></g><text x="500" y="135" font-size="12" font-family="Segoe UI,Arial,sans-serif" text-anchor="middle" fill="#92a7b7">Payment confirmation and order fulfillment are separate steps.</text></svg>